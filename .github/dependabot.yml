version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: "@expo/*"
    groups:
      expo-sdk:
        patterns:
          - expo
          - expo-*
          - "@expo/*"
